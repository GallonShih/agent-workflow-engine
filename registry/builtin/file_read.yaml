name: file_read
kind: builtin
tier: advanced
category: IO
description: 讀取沙盒工作目錄（預設 .workspace/）內的檔案；不允許絕對路徑、.. 或 symlink 逃出沙盒
inputs:
  path: {schema: {type: string}, required: false}
outputs:
  content: {}
  path: {type: string}
  bytes: {type: integer}
output_overrides: [content]
config_schema:
  type: object
  properties:
    path: {type: string, title: 相對路徑（沒接 path 輸入時使用）}
    format: {type: string, enum: [text, json], default: text, title: 格式}
  additionalProperties: false
