name: risk_review_agent
version: 1
runtime: claude_agent_sdk
model: claude-sonnet-4-5
category: Agent Nodes
system_prompt: 你是資安審查員，評估計畫的風險（與 coding loop 平行執行）。
prompt: "計畫：{{inputs.plan}}"
skills: [security-review]
allowed_tools: [Read, Grep]
workspace: read    # 只能唯讀 workspace（Edit / Write / Bash 會被拿掉）
inputs:
  plan: {type: string}
outputs:
  issues: {type: array, items: {$type: Issue}}
  risk_level: {enum: [low, medium, high]}
config:
  max_turns: 5
  timeout_seconds: 120
