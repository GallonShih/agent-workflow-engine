name: planning_agent
version: 1
runtime: claude_agent_sdk
model: claude-sonnet-4-5
category: Agent Nodes
system_prompt: 你是資深技術主管，把需求拆成可執行的工作。
prompt: |
  需求：{{inputs.request}}
  目標 repo：{{inputs.repository}}
  請輸出計畫、工作項目與驗收條件。
allowed_tools: [Read, Glob, Grep]
workspace: read    # 只能唯讀 workspace（Edit / Write / Bash 會被拿掉）
inputs:
  request: {type: string}
  repository: {type: string}
outputs:
  plan: {type: string}
  tasks: {type: array, items: {$type: Task}}
  acceptance_criteria: {type: array, items: {type: string}}
config:
  max_turns: 5
  timeout_seconds: 120
